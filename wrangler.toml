# One Worker per team, with its own D1. The page is static assets in ./public;
# only /api/* and /mcp run the Worker. Fill in the database id, then see README.md.

name = "work-tracker"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# One address only: the custom domain below. No workers.dev, so there's no second
# way in that nobody watches. People and agents both sign in with a token.
workers_dev = false
# routes = [{ pattern = "tracker.example.com", custom_domain = true }]
preview_urls = false

[assets]
directory = "./public"
# The page holds nothing private, so it's served without running any code.
run_worker_first = ["/api/*", "/mcp"]

[observability]
enabled = true

# Traces to Tempo and logs to Loki: add OTLP destinations for each in the
# Cloudflare dashboard (Workers Observability), then name them below. Or set
# OTEL_EXPORTER_OTLP_ENDPOINT, and the secret OTEL_EXPORTER_OTLP_HEADERS, and
# the Worker exports both itself.
[observability.traces]
enabled = true
# destinations = ["grafana-tempo"]

[observability.logs]
enabled = true
invocation_logs = true
# destinations = ["grafana-loki"]

[[d1_databases]]
binding = "DB"
database_name = "work-tracker"           # wrangler d1 create work-tracker --location oc
database_id = "<d1 id>"
